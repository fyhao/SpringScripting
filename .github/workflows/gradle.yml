name: "Validate SAST DEP"
on: [push, pull_request]

jobs:
  validation:
    name: "Validation"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: [11,14,15,16,17]
        distribution: ['zulu']
        os : ['ubuntu-latest','windows-latest','macos-latest']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }} Distribution ${{ matrix.distribution }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: test with Gradle
        run: ./gradlew test
      - name: Build with Gradle
        run: ./gradlew build
      - name: generateLicenseReport with Gradle
        run: ./gradlew generateLicenseReport
      #- name: dependencyCheckAnalyze with Gradle
      #  run: ./gradlew dependencyCheckAnalyze
      - uses: actions/upload-artifact@v4
        with:
          name: licenseDependencyReport-${{ matrix.os }}-java-${{ matrix.java }}
          path: build/reports

  mysql-integration:
    name: "MySQL Integration"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spring_scripting
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: spring_scripting
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test MySQL interaction
        run: ./gradlew test --tests com.fyhao.springwebapps.integration.MySqlIntegrationTest
       
     
         
